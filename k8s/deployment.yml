apiVersion: apps/v1
kind: Deployment

metadata:
  name: shopping-cart-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: shopping-cart

  template:
    metadata:
      labels:
        app: shopping-cart

    spec:
      containers:
      - name: shopping-cart

        image: IMAGE_NAME

        ports:
        - containerPort: 8080